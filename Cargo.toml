[package]
name = "glowpub"
version = "0.4.0"
authors = ["QuartzLibrary"]
license = "MIT OR Apache-2.0"
description = "A glowfic to epub converter."
repository = "https://github.com/QuartzLibrary/glowpub"
readme = "README.md"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
mime = "0.3"
rand = "0.8"
regex = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

fontdb = "0.16"
resvg = "0.41"
textwrap = "0.16"
tiny-skia = "0.11"
usvg = "0.41"

epub-builder = { version = "0.7", default-features = false, features = ["libzip"] }

ammonia = "4"
cssparser = "0.33"
html-escape = "0.2"
html5ever = "0.27"
lightningcss = "1.0.0-alpha.55"
lol_html = "1"
markup5ever = "0.12"
markup5ever_rcdom = "0.3"
xml5ever = "0.18"

image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }

slug = "0.1"

# Native-only dependencies: networking, async runtime, filesystem cache, and the CLI.
# The library builds for wasm32 without them (see src/lib.rs cfg gates); the
# `Thread::to_epub_remote_images` path is fully available on wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
glob = "0.3"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
simple_logger = "4"
rpassword = "7.3.1"

# On wasm32-unknown-unknown, getrandom needs its JS backends enabled
# (pulled in transitively via `rand` and `uuid`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }
